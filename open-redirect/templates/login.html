<!doctype html>
<html>
<head><meta charset="utf-8"><title>Login (Insecure)</title></head>
<body>
  <h1>Login (Insecure)</h1>
  <form method="post">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>Username: <input name="username"></label><br>
    <label>Password: <input name="password" type="password"></label><br>
    <button>Login</button>
  </form>

  <p>Example safe link: <a href="{{ url_for('login') }}">/login</a></p>
  <p>Example redirect param: <code>/login?next=https://evil.example.com</code></p>
</body>
</html>
