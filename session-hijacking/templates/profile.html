<!doctype html>
<html>
<head><meta charset="utf-8"><title>Profile</title></head>
<body>
  <h1>Welcome, {{ user }}</h1>

  <h2>Leave a comment</h2>
  <form method="post">
    <input type="text" name="comment" placeholder="Comment">
    <button>Post</button>
  </form>

  <h2>Comments</h2>
  <ul>
    {% for c in comments %}
      <!-- ❌ УЯЗВИМО: рендерим ввод пользователя без экранирования -->
      <li>{{ c|safe }}</li>
    {% endfor %}
  </ul>
</body>
</html>
